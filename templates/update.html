{% extends 'base.html' %}
{% block body %}
<div class="container py-5">
  <div class="card glass-card shadow-lg p-4">
    <h2 class="text-center mb-4 fw-semibold">Update ToDo 🛠️</h2>
    <form action="/update/{{todo.sno}}" method="POST">
      <div class="mb-3">
        <label for="todoTitle" class="form-label fw-medium">Title</label>
        <input type="text" name="title" value="{{todo.title}}" class="form-control modern-input" id="title" required>
      </div>
      <div class="mb-3">
        <label for="todoDesc" class="form-label fw-medium">Description</label>
        <textarea class="form-control modern-input" name="desc" id="desc" rows="3">{{todo.desc}}</textarea>
      </div>
      <button type="submit" class="btn modern-btn w-100">Update</button>
    </form>
  </div>
</div>
{% endblock body %}
